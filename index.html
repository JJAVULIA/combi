<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMBI · Asistente de Combinados</title>
<link id="favicon" rel="icon" href="data:,">
<style>
  :root{
    --bordo:#7B1E2B; --bordo-osc:#5E1520;
    --carbon:#1F1F1F;
    --azul:#1F4E8C; --azul-osc:#163A6A;
    --plata:#ECEDF0; --borde:#D3D5DB;
    --oro:#C9A227;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#cfd2d9; color:var(--carbon);
    display:flex; justify-content:center; align-items:center;
  }
  .app{
    width:100%; max-width:480px;
    height:100vh; height:100dvh; max-height:820px;
    display:flex; flex-direction:column;
    background:var(--plata);
    border-radius:18px; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  @media (max-width:520px){ .app{max-height:none;border-radius:0} }

  /* Encabezado: bordó con franjas negras, como la bandera de Salta */
  header{
    background:var(--bordo); color:#fff;
    border-top:7px solid var(--carbon); border-bottom:7px solid var(--carbon);
    padding:10px 14px; display:flex; align-items:center; gap:12px;
  }
  header .title{flex:1; min-width:0}
  header h1{margin:0; font-size:22px; letter-spacing:.08em; line-height:1.1}
  header p{margin:2px 0 0; font-size:13px; opacity:.92}
  .reset{
    font:inherit; font-size:13px; color:#fff; background:transparent;
    border:1px solid rgba(255,255,255,.7); border-radius:999px;
    padding:6px 12px; cursor:pointer; white-space:nowrap;
  }
  .reset:hover{background:rgba(255,255,255,.15)}
  .reset:focus-visible{outline:3px solid var(--oro); outline-offset:2px}

  .avatar{flex:none; width:30px; height:30px; display:inline-block}
  .avatar.big{width:46px; height:46px}
  .avatar svg{width:100%; height:100%; display:block}

  #chat{
    flex:1; overflow-y:auto; padding:16px 14px;
    display:flex; flex-direction:column; gap:10px;
    scroll-behavior:smooth;
  }
  .msg{display:flex; gap:8px; align-items:flex-end; max-width:90%}
  .msg.bot{align-self:flex-start}
  .msg.user{align-self:flex-end}
  .bubble{
    padding:10px 14px; border-radius:16px; font-size:16px; line-height:1.45;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .bot .bubble{background:#fff; border:1px solid var(--borde); border-bottom-left-radius:4px}
  .user .bubble{background:var(--bordo); color:#fff; border-bottom-right-radius:4px}

  .maplink{align-self:flex-start; margin-left:38px; padding:8px 14px; border-radius:999px; background:#fff; color:var(--azul); border:2px solid var(--azul); font-weight:700; text-decoration:none; font-size:.95rem}
  .maplink:hover{background:var(--azul); color:#fff}
  .chips{display:flex; flex-wrap:wrap; gap:8px; padding-left:38px}
  .chip{
    font:inherit; font-size:15px; line-height:1.25; text-align:left;
    background:var(--azul); color:#fff; border:0; border-radius:999px;
    padding:9px 14px; cursor:pointer;
  }
  .chip:hover{background:var(--azul-osc)}
  .chip:focus-visible{outline:3px solid var(--oro); outline-offset:2px}

  .typing .bubble{display:flex; gap:5px; padding:14px 16px}
  .dot{width:8px; height:8px; border-radius:50%; background:#9a9ca5; animation:blink 1s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.15s} .dot:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.3; transform:translateY(0)}40%{opacity:1; transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} #chat{scroll-behavior:auto} }

  footer{background:#fff; border-top:1px solid var(--borde); padding:10px 12px 8px}
  form{display:flex; gap:8px}
  input[type=text]{
    flex:1; min-width:0; font:inherit; font-size:16px;
    padding:11px 16px; border:1px solid var(--borde); border-radius:999px; background:#fff; color:var(--carbon);
  }
  input[type=text]:focus{outline:3px solid var(--azul); outline-offset:0; border-color:var(--azul)}
  input[type=text]:disabled{background:#f3f4f6}
  .send{
    font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--bordo);
    border:0; border-radius:999px; padding:0 18px; cursor:pointer;
  }
  .send:hover{background:var(--bordo-osc)}
  .send:disabled{opacity:.55; cursor:default}
  .send:focus-visible{outline:3px solid var(--oro); outline-offset:2px}
  .note{margin:8px 2px 0; font-size:12px; color:#5b5d66; text-align:center; line-height:1.35}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="avatar big" id="hdrAvatar" aria-hidden="true"></span>
    <div class="title">
      <h1>COMBI</h1>
      <p>Asistente de Combinados · Moverse es combinar.</p>
    </div>
    <button type="button" id="resetBtn" class="reset" title="Empezar una conversación nueva">↻ Reiniciar</button>
  </header>

  <main id="chat" role="log" aria-live="polite" aria-label="Conversación con COMBI"></main>

  <footer>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Escribí tu mensaje o una dirección…" aria-label="Escribí tu mensaje" maxlength="300">
      <button class="send" id="sendBtn" type="submit">Enviar</button>
    </form>
    <p class="note">Prototipo académico · Grupo Línea Directa · Ruta Ágil es una organización ficticia. COMBI orienta con tiempos estimados.</p>
  </footer>
</div>

      const all = linesFor(ctx.dest).filter(i => i !== ex && linesFor(ctx.origin).includes(i)).sort((a,b) => hw(a) - hw(b)).slice(0,3);
      txt = 'Podés tomar ' + all.map(det).join(' o ') + '. ' + salida(all[0], 'Sale');
    } else {
      const fa = freqText(pl.a), fb = freqText(pl.b);
      txt = 'Combiná: ' + det(pl.a) + ' hasta ' + pl.where + ' y ahí ' + det(pl.b) + '. ' + (fa && fb ? 'Salen ' + fa + ' y ' + fb + '.' : NOINFO);
    }
    await say(txt, undefined, 'c3_ok', mapsLink());
    return say('Si antes llega tu colectivo, subite. ¿Te sirve?', chips, 'c3_ok');
  }
  async function l1Start(n){
    ctx = {};
    const k = has(n, ['accident','emergenc']) ? 'Lamento lo que te pasó.' : 'Lamento lo que pasó.';
    return say(k + ' No puedo ayudarte con esto, pero sí orientarte. ¿Qué necesitás?',
      ['a. Reclamo o queja','b. Accidente o emergencia'], 'l1_menu');
  }
  async function l2Start(){
    ctx = {};
    return say('No puedo asegurar la hora exacta: es estimada y puede variar. ¿Qué corredor y línea tomás?',
      ['Corredor 1, línea B'], 'l2_stop');
  }

  const L1_NEXT = ['A. Ayuda con el viaje de hoy','B. Volver al menú','C. Finalizar'];

  const H = {
    async menu(t, n){
      if (has(n, ['hola','buenas','buen dia','buenos dias']) && n.length < 20) return say('¡Hola! ¿Qué necesitás hoy?', MENU);
      if (n === '3' || has(n, ['demora','no pasa','tarda','cambio','esper'])) return c3Start();
      if (n === '2' || has(n, ['compar','conviene','opciones','directo'])) return c2Start(t);
      if (n === '1' || has(n, ['recorrido','armar','viaje','llegar','quiero ir','tengo que ir','salgo','voy a'])) return c1Start(t);
      if (has(n, ['gracias','chau','adios','hasta luego'])) return say('¡De nada! Acá estoy cuando me necesites.', MENU);
      const pl = findPlace(t);
      if (pl && n.length < 45){ ctx = {}; ctx.dest = pl; return say('Anotado: ' + pl + '. ' + ORIG_Q, ORIG_CHIPS, 'c1_origin'); }
      return say('No te entendí. Elegí una opción:', MENU);
    },

    /* Camino 1 · Planificar un recorrido combinado */
    async c1_dest(t, n){
      if (has(n, ['otra direccion'])) return askAddress();
      const d = parseDest(t);
      ctx.dest = placeOrText(d || t);
      return say('Anotado: ' + ctx.dest + '. ' + ORIG_Q, ORIG_CHIPS, 'c1_origin');
    },
    async c1_origin(t, n){
      if (has(n, ['otra direccion'])) return askAddress();
      const { origin } = parseTrip(t);
      ctx.origin = (origin ? placeOrText(origin) : findPlace(t)) || nice(clean(t));
      return say('Listo: ' + ctx.origin + ' → ' + ctx.dest + '. ' + PREF_Q, PREF_CHIPS, 'c1_pref');
    },
    async c1_route(t, n){
      const m = t.toLowerCase().match(/\bde(?:sde)?\s+(.+?)(?:,|\s+y)?\s+(?:voy\s+|quiero ir\s+|ir\s+)?(?:a la|al|a|hasta)\s+(.+)/);
      if (m){ ctx.origin = placeOrText(m[1]); ctx.dest = placeOrText(m[2]); }
      else { ctx.origin = null; ctx.dest = placeOrText(t); }
      return say('Listo: ' + (ctx.origin ? ctx.origin + ' → ' : '') + ctx.dest + '. ' + PREF_Q, PREF_CHIPS, 'c1_pref');
    },
    async c1_pref(t, n){
      let txt;
      if (has(n, ['margen','tiempo','tempran','seguro'])){
        ctx.pref = 'margen';
        txt = 'Salí con tiempo extra: colectivo desde la parada más cercana y un tramo a pie al final. ¿Te lo detallo?';
      } else if (has(n, ['camin','poco'])){
        ctx.pref = 'caminar';
        txt = 'Mejor un colectivo directo, con parada cerca de tu origen y de tu destino. ¿Te lo detallo?';
      } else if (has(n, ['gast','barat','econom','plata','menos'])){
        ctx.pref = 'gastar';
        txt = 'Priorizá un solo medio, sin combinar. ¿Te lo detallo?';
      } else {
        return say('Elegí una opción:', PREF_CHIPS);
      }
      return say(txt, ['Sí, detallame','No, gracias'], 'c1_detail_q');
    },
    async c1_detail_q(t, n){
      const r = yn(n);
      if (r === 'no') return goMenu('Sin problema. ¿Qué querés hacer ahora?');
      if (r !== 'yes') return reask();
      const pl = plan(ctx.origin, ctx.dest);
      const det = i => (/^Línea/.test(LINES[i].l) ? 'la ' : 'el servicio ') + LINES[i].l;
      if (!pl){
        await say('No tengo líneas cargadas para ese lugar. Probá con el mapa.', undefined, 'c1_ok', mapsLink());
        return say('Tiempos estimados. ¿Vamos bien?', ['Sí. ¿Y si tarda?','Sí, seguí'], 'c1_ok');
      }
      let a;
      if (pl.type === 'direct'){
        a = 'Tomá ' + pl.a.map(det).join(' o ') + ': llega a ' + ctx.dest + '. ' + salida(pl.a[0], 'Sale');
      } else if (pl.type === 'combo'){
        const fa = freqText(pl.a), fb = freqText(pl.b);
        a = 'Tomá ' + det(pl.a) + ' y combiná en ' + pl.where + ' con ' + det(pl.b) + '. ' + (fa && fb ? 'Salen ' + fa + ' y ' + fb + '.' : NOINFO);
      } else {
        a = 'A ' + ctx.dest + ' llega ' + pl.a.map(det).join(' o ') + '. ' + salida(pl.a[0], 'Sale');
      }
      await say(a, undefined, 'c1_ok');
      return say(FARE + ' Horarios de planilla SAETA: confirmalos ahí. ¿Vamos bien?',
        ['Sí. ¿Y si tarda?','Sí, seguí'], 'c1_ok', mapsLink());
    },
    async c1_ok(t, n){
      if (yn(n) === 'no') return goMenu('Entiendo. ¿Qué querés hacer ahora?');
      return say('Si tarda, avisame y busco otra opción. Salí con unos minutos de margen. Si algo cambia, escribime.', MENU, 'menu');
    },

    /* Camino 2 · Comparar opciones de transporte */
    async c2_q(){
      return say('¿Qué tan apurado estás y cuánto te molesta caminar?',
        ['No estoy apurado, camino poco','Estoy apurado, no me molesta caminar'], 'c2_prefs');
    },
    async c2_prefs(){
      return say('Opción A: colectivo directo, poca caminata. Opción B: combinar medios, más rápida pero con cambios. ¿Cuál elegís?',
        ['La A, sin cambios','La B, más rápida'], 'c2_choice');
    },
    async c2_choice(t, n){
      let pick = null;
      const la = /\ba\b/.test(n), lb = /\bb\b/.test(n);
      if (la && !lb) pick = 'A';
      else if (lb && !la) pick = 'B';
      else if (has(n, ['directo','sin cambios','sin combin','no quiero hacer'])) pick = 'A';
      else if (has(n, ['combin','rapid'])) pick = 'B';
      if (!pick) return say('Elegí una opción:', lastChips);
      ctx.pick = pick;
      const body = pick === 'A' ? 'La A te conviene: poca caminata y sin cambios.' : 'La B te conviene: más rápida, con más cambios.';
      return say(body + ' Tiempo estimado. ¿Te dejo un plan B?',
        ['Sí, plan B','No, así está bien'], 'c2_alt');
    },
    async c2_alt(t, n){
      const r = yn(n);
      if (r === 'yes'){
        const o = ctx.pick === 'B' ? 'B' : 'A', p = ctx.pick === 'B' ? 'A' : 'B';
        return say('Si la ' + o + ' falla, usá la ' + p + '. Escribime si algo cambia.', MENU, 'menu');
      }
      if (r === 'no') return say('Perfecto. Escribime si algo cambia.', MENU, 'menu');
      return reask();
    },

    /* Camino 3 · Demoras o cambios en el recorrido */
    async c3_route(t, n){
      const m = t.toLowerCase().match(/\bde(?:sde)?\s+(.+?)(?:,|\s+y)?\s+(?:voy\s+|quiero ir\s+|ir\s+)?(?:a la|al|a|hasta)\s+(.+)/);
      if (m){ ctx.origin = placeOrText(m[1]); ctx.dest = placeOrText(m[2]); }
      else if (!ctx.dest){ ctx.dest = placeOrText(t); return say('¿Y desde dónde esperás?', ['Barrio Tres Cerritos','Otra dirección'], 'c3_route'); }
      else { ctx.origin = placeOrText(t); }
      return say('¿Qué línea esperás? Escribí corredor y línea.', ['Corredor 5, línea A','No sé cuál es'], 'c3_line');
    },
    async c3_line(t, n){
      let ex = -1;
      if (!has(n, ['no se','ni idea','otra'])){
        ex = matchLine(n);
        if (ex < 0) return say('No encuentro esa línea. Escribí corredor y línea, por ejemplo: Corredor 5, línea A.', ['Corredor 5, línea A','No sé cuál es']);
      }
      ctx.ex = ex;
      return c3Alternatives();
    },
    async c3_ok(t, n){
      const r = yn(n);
      if (r === 'yes') return say('De nada. Si algo cambia, escribime. ¡Buen viaje!', MENU, 'menu');
      if (r === 'no') return say('No tengo más alternativas cargadas. Probá con el mapa o consultá a SAETA.', MENU, 'menu', mapsLink());
      return reask();
    },

    /* Pregunta límite 1 · Reclamos, denuncias, accidentes y emergencias */
    async l1_menu(t, n){
      const isB = n === 'b' || n.startsWith('b.') || has(n, ['accident','emergenc']);
      const isA = n === 'a' || n.startsWith('a.') || has(n, ['reclam','queja','denunci']);
      if (isB) return say('Llamá al 911, el número de emergencias de Salta. ¿Cómo seguimos?', L1_NEXT, 'l1_next');
      if (isA) return say('Para reclamos, contactá a la AMT o a la CNRT. Si es de una línea, también a su empresa operadora. ¿Cómo seguimos?', L1_NEXT, 'l1_next');
      return say('Elegí una opción: a. Reclamo o queja, b. Accidente o emergencia.', ['a. Reclamo o queja','b. Accidente o emergencia']);
    },
    async l1_next(t, n){
      if (n === 'a' || n.startsWith('a.') || has(n, ['viaje','ayuda'])){
        return say('Dale. ¿Desde dónde salís y a dónde vas?', ['De Tres Cerritos a la Plaza 9 de Julio'], 'c1_route');
      }
      if (n === 'b' || n.startsWith('b.') || has(n, ['menu','volver'])) return goMenu('Volvemos al inicio. ¿Qué necesitás hoy?');
      if (n === 'c' || n.startsWith('c.') || has(n, ['final','chau','gracias','nada mas'])){
        return say('Gracias por escribir. Cuidate. Acá estoy cuando me necesites.', ['Nueva conversación'], 'ended');
      }
      return say('Elegí cómo seguimos:', L1_NEXT);
    },

    /* Pregunta límite 2 · Horario exacto de paso por la parada */
    async l2_stop(t, n){
      const idx = matchLine(n);
      const f = idx >= 0 ? freqText(idx) : null;
      const tt = idx >= 0 && LINES[idx].t && LINES[idx].t[dayKey()];
      if (tt){
        ctx.line = idx;
        const pts = []; tt.c.forEach(c => { if (!pts.includes(c) && !/^(1|7)? ?sa$/i.test(c)) pts.push(c); });
        ctx.pts = pts;
        const pick = pts.length <= 4 ? pts : [pts[1], pts[Math.floor(pts.length/2)], pts[pts.length-2], pts[0]].filter((v,i,a) => a.indexOf(v) === i);
        return say('Tengo su planilla. ¿Por qué punto la esperás?', pick.map(titleCase2), 'l2_point');
      }
      const msg = f
        ? (/^Línea/.test(LINES[idx].l) ? 'La ' : 'El servicio ') + LINES[idx].l + ' sale de la cabecera ' + f + '. En tu parada puede variar: llegá con margen. ¿Preparo un plan B?'
        : NOINFO + ' Llegá con margen. ¿Preparo un plan B?';
      return say(msg, ['Sí, plan B','No, gracias'], 'l2_alt');
    },
    async l2_point(t, n){
      const l = LINES[ctx.line], tt = l.t[dayKey()];
      const toks = n.split(/[^a-z0-9]+/).filter(w => w.length >= 3);
      let best = null, bs = 0;
      ctx.pts.forEach(pt => {
        const k = norm(pt); let sc = norm(t) === k ? 99 : 0;
        toks.forEach(w => { if (k.includes(w)) sc++; });
        if (sc > bs){ bs = sc; best = pt; }
      });
      if (!best) return say('Elegí un punto de la lista:', lastChips);
      const now = nowMin(), conv = m => m < 240 ? m + 1440 : m, cur = conv(now);
      const times = [];
      tt.c.forEach((c, k) => { if (c === best) tt.r.forEach(r => { const v = r.split(',')[k]; if (v) times.push(mins(v)); }); });
      const next = [...new Set(times.map(conv))].filter(m => m >= cur).sort((a,b) => a - b).slice(0,3)
        .map(m => { m %= 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); });
      const nm = titleCase2(best);
      const msg = next.length
        ? 'Según planilla, pasa por ' + nm + ' a las ' + next.join(', ') + '. Es teórico y puede variar: llegá con margen. ¿Preparo un plan B?'
        : 'Hoy ya no quedan pasos por ' + nm + ' según la planilla. Confirmá con SAETA. ¿Preparo un plan B?';
      return say(msg, ['Sí, plan B','No, gracias'], 'l2_alt');
    },
    async l2_alt(t, n){
      const r = yn(n);
      if (r === 'yes') return say('Listo. Si no llega a la hora estimada, avisame y busco otro recorrido. Horarios oficiales: sistema de transporte. ¿Seguimos con tu viaje?',
        ['Sí, seguimos','No, por ahora está bien'], 'l2_continue');
      if (r === 'no') return say('Perfecto. Llegá con margen y confirmá los horarios oficiales en el sistema de transporte. ¿Seguimos con tu viaje?',
        ['Sí, seguimos','No, por ahora está bien'], 'l2_continue');
      return reask();
    },
    async l2_continue(t, n){
      const r = yn(n);
      if (r === 'yes') return c1Start('');
      if (r === 'no') return say('Dale. ¡Buen viaje!', MENU, 'menu');
      return reask();
    },

    async ended(){ chat.innerHTML = ''; return welcome(); }
  };

  /* ---------- Palabras que activan las preguntas límite ---------- */
  function intent(n){
    // Pregunta límite 1: reclamos, denuncias, accidentes y emergencias
    if (has(n, ['reclam','denunci','accident','emergenc','queja','quejar','choque','choco','chocaron','me cai',
                'herid','ambulancia','urgencia','incidente','siniestro','maltrat','agredi','agresion']) ||
        /\b(robo|robaron|asalto|asaltaron|me pegaron)\b/.test(n)) return 'l1';
    // Pregunta límite 2: horario exacto de paso por la parada
    const pasa = '(pasa|pasan|pase|pasar|paso|pasaria|llega|llegan|llegue|llegaria|viene|vienen|venga|sale|salen)';
    if (new RegExp('a que hora.{0,25}\\b' + pasa + '\\b').test(n) ||
        new RegExp('\\b(hora|horas|horario|horarios)\\b.{0,35}\\b' + pasa + '\\b').test(n) ||
        new RegExp('\\b' + pasa + '\\b.{0,35}\\b(hora|horas|horario|horarios)\\b').test(n) ||
        /\b(hora|horario) (exact|certer|seguro|preciso)/.test(n) ||
        /\b(horario|horarios)\b.{0,30}\b(colectivo|colectivos|bondi|micro|linea|parada|tren)\b/.test(n) ||
        /\b(colectivo|colectivos|bondi|micro|linea|parada|tren)\b.{0,30}\b(horario|horarios)\b/.test(n) ||
        /\b(exactamente|con exactitud|cuanto falta|cuanto tarda en (pasar|llegar|venir)|cuando (pasa|pasan|llega|viene|sale))\b/.test(n) ||
        /\b(decime|dime|pasame|pasa me|dame|decirme|saber|quiero|necesito)\b.{0,20}\b(el )?horario\b/.test(n)) return 'l2';
    return null;
  }

  async function handle(text){
    const n = norm(text);
    if (/^(menu|inicio|volver|volver al menu|menu principal)$/.test(n)) return goMenu('Volvemos al inicio. ¿Qué necesitás hoy?');
    if (state !== 'ended'){
      const it = intent(n);
      if (it === 'l1' && !state.startsWith('l1_')) return l1Start(n);
      if (it === 'l2' && !state.startsWith('l2_')) return l2Start();
    }
    if (/^c1_(pref|detail_q|ok|remind)$/.test(state) && /\b(no salgo|no voy|sino|me equivoque|equivoque|corregir|cambiar)\b/.test(n)){
      const sp = text.split(/\bsino\b/i);
      if (sp.length > 1 && sp[1].trim()){
        const val = placeOrText(sp[1]);
        if (/\b(no voy|destino)\b/.test(n)) ctx.dest = val; else ctx.origin = val;
        return say('Corregido: ' + (ctx.origin ? ctx.origin + ' → ' : '') + ctx.dest + '. ¿Qué preferís?', PREF_CHIPS, 'c1_pref');
      }
      return say('Dale. ¿Desde dónde salís y a dónde vas?', ['De Tres Cerritos a la Plaza 9 de Julio'], 'c1_route');
    }
    const fn = H[state] || H.menu;
    return fn(text, n);
  }

  /* El campo nunca se bloquea: si escribís mientras COMBI responde,
     el mensaje queda en cola y se responde en orden. */
  const queue = [];
  let epoch = 0;
  async function pump(){
    if (busy) return;
    busy = true;
    const my = epoch;
    try {
      while (queue.length && my === epoch){
        const t = queue.shift();
        addUser(t);
        try { await handle(t); }
        catch (e) { console.error(e); addBot('Ups, algo falló de mi lado. Probemos de nuevo desde el inicio.'); showChips(MENU); state = 'menu'; ctx = {}; }
      }
    } finally {
      if (my === epoch) busy = false;
    }
  }
  function send(text){
    text = (text || '').trim();
    if (!text) return Promise.resolve();
    queue.push(text);
    return pump();
  }
  function restart(){
    epoch++; busy = false; queue.length = 0;
    chat.innerHTML = ''; welcome();
  }

  form.addEventListener('submit', e => { e.preventDefault(); const v = input.value; input.value = ''; send(v); input.focus(); });
  document.getElementById('resetBtn').addEventListener('click', () => { restart(); input.focus(); });

  window.__combi = { send, get state(){ return state; } };
  welcome();
})();
</script>
